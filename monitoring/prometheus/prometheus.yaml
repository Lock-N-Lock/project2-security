global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
  
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets:
          - grafana:3000

  - job_name: nginx-exporter
    static_configs:
      - targets:
          - nginx-exporter:9113

  - job_name: recovery
    static_configs:
      - targets:
          - recovery:8000

  - job_name: app-nodes
    http_sd_configs:
      - url: http://tailscale-sd:9999/app-targets
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_ts_hostname]
        target_label: ts_host        # ★ instance(ip:port) 유지, hostname은 별도 라벨

  - job_name: app-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    http_sd_configs:
      - url: http://tailscale-sd:9999/app-targets
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        replacement: 'http://${1}/health'
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - source_labels: [__meta_ts_hostname]
        target_label: ts_host
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: db-node
    http_sd_configs:
      - url: http://tailscale-sd:9999/db-targets
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_ts_hostname]
        target_label: ts_host

  # BEGIN AUTO GENERATED: nginx-log-metrics
  - job_name: nginx-log-metrics
    metrics_path: /nginx_log_metrics.prom
    static_configs:
      - targets:
          - 100.70.36.115:9105
  # END AUTO GENERATED: nginx-log-metrics

  # BEGIN AUTO GENERATED: lockbank-app-metrics
  - job_name: lockbank-app-metrics
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
          - 100.98.17.52
  # END AUTO GENERATED: lockbank-app-metrics
