# security/nginx/nginx.conf
# Nginx 메인 설정 파일

# 역할 :
# - ALB에서 전달된 HTTP 요청 수신
# - 요청 경로별 Rate Limit 적용
# - Access Log 생성
# - FastAPI Container로 Reverse Proxy

# HTTPS는 Nginx가 아닌 ALB+ACM에서 처리하므로
# Nginx는 내부 HTTP 80 포트만 수신함.

events {}

http {
    include /etc/nginx/conf.d/log-format.conf;
    include /etc/nginx/conf.d/rate-limit.conf;

    access_log /var/log/nginx/access.log security_json;
    error_log  /var/log/nginx/error.log warn;

    set_real_ip_from 10.0.0.0/16; # AWS VPC 대역 입력 (ALB가 위치한 IP 대역)
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Nginx 버전 정보를 숨깁니다 (Server Leaks Version 취약점 해결)
    server_tokens off;

    server {
        listen 80;

        # ==========================================
        # 🎯 Security Headers 보완 및 추가
        # ==========================================
        
        # Security Headers
        # 클릭 재킹, MIME 스니핑, URL 정보 유출, XSS 공격 방지 및 완화
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # [보안 검토] 기존 작성해주신 CSP 정책 유지
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'sha256-0K5cGQBl1BYBepr7KTfE6koOYwvL1twFLd4ZXu+xLFA=' 'sha256-SNtwAnWJ4MeL+cO/4DGFXDoAQNdRgTx4cchKjO7mIIA=' 'sha256-jo46XDSlR4CRWZGboxKEBq5ms92CUeNpv79V79MYdEU=' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com;" always;

        # Cross-Origin 관련 헤더 3종 세트 해결
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        # 권한 정책 설정 (Permissions Policy 해결) - 불필요한 하드웨어 권한 차단
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        #  HSTS 설정 (Strict-Transport-Security 해결) 
        # ALB에서 HTTPS를 처리하므로, 브라우저가 ALB와 HTTPS 통신을 강제하도록 헤더를 내려줍니다.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # 로그인 및 민감 페이지 캐시 만료 설정 (Re-examine Cache-control 해결)
        # 중요 정보가 브라우저에 남는 것을 방지합니다.
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;

        # -------------------------------------------------------------
        # [Health Check]
        # Rate Limit 적용 x, ALB Target Group Health Check 용도
        # 배포 시 정상 서버 판단 기준 --> FastAPI /health 응답이 200이면 정상
        # -------------------------------------------------------------
        location /health {
            proxy_pass http://lb-fastapi:8080/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # -------------------------------------------------------------
        # Login API
        # login_limit 적용 (rate-limit.conf 기준)
        # 초과 요청은 429 Too Many Requests 반환
        # 401 로그인 실패 로그는 fail2ban 탐지에 활용
        # -------------------------------------------------------------
        location /login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://lb-fastapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

            # 백엔드 에러 노출 차단 (Private IP Disclosure 완화)
            proxy_intercept_errors on;
        }

        # -------------------------------------------------------------
        # Transfer API
        # 금융 서비스 민감 기능인 이체 요청 보호
        # transfer_limit 적용, 로그인/일반 API보다 더 엄격하게 제한
        # 반복 이체 요청 혹은 자동화 남용 방지
        # 초과 요청은 429 Too Many Requests 반환
        # -------------------------------------------------------------
        location /transfer {
            limit_req zone=transfer_limit burst=3 nodelay;

            proxy_pass http://lb-fastapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
            # 백엔드 에러 노출 차단 (Private IP Disclosure 완화)
            proxy_intercept_errors on;
        }

        # -------------------------------------------------------------
        # 일반 API
        # 계좌 조회, 거래 내역 등 일반 API 요청 보호
        # api_limit 적용 및 API Flooding 공격 완화
        # 초과 요청은 429 Too Many Requests 반환
        # -------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://lb-fastapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
            # 백엔드 에러 노출 차단 (Private IP Disclosure 완화)
            proxy_intercept_errors on;
        }

        # -------------------------------------------------------------
        # Default Route
        # 정적 페이지 또는 기타 요청 --> FastAPI로 전달
        # 별도의 Rate Limit은 적용하지 않음
        # 필요 시 기본 요청 제한 정책 추가 가능.
        # -------------------------------------------------------------
        location / {
            proxy_pass http://lb-fastapi:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        
            # 백엔드 에러 노출 차단 (Private IP Disclosure 완화)
            proxy_intercept_errors on;
        }

        location /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/16;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            #docker bridge 대역도 허용
            allow 172.17.0.0/16;
            allow 172.18.0.0/16;
            allow 172.19.0.0/16;
            deny all;
        }
    }
}